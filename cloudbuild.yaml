# Automated Cloud Build CI/CD Pipeline for AI Scrum Master
steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/api:latest', '-f', 'apps/api/Dockerfile', '.']

  # 2. Push API Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-image'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/api:latest']

  # 3. Build Web Cockpit Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web-image'
    args: [
      'build',
      '--build-arg', 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL',
      '--build-arg', 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_NEXT_PUBLIC_GOOGLE_CLIENT_ID',
      '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/web:latest',
      '-f', 'apps/web/Dockerfile',
      '.'
    ]

  # 4. Push Web Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web-image'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/web:latest']

  # 5. Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-scrum-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/api:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=PROJECT_ID=$PROJECT_ID,REGION=$_REGION,ENVIRONMENT=prod'

  # 6. Deploy Web Cockpit to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-scrum-cockpit'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/app-images/web:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'
  _NEXT_PUBLIC_API_URL: ''
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
