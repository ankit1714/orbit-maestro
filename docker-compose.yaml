services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-scrum-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=dev
      - PROJECT_ID=ai-scrum-master-demo
      - REGION=europe-west3
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-scrum-cockpit
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/v1
    depends_on:
      - api
