[tool.poetry]
name = "ai-scrum-agents"
version = "1.0.0"
description = "Vertex AI ADK Multi-Agent System for AI Scrum Master"
authors = ["AI Scrum Team <team@enterprise.internal>"]
readme = "README.md"
packages = [{include = "agents", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9.0"
google-cloud-aiplatform = "^1.70.0"
google-cloud-documentai = "^2.30.0"
google-cloud-firestore = "^2.19.0"
jinja2 = "^3.1.4"
networkx = "^3.3"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
