[tool.poetry]
name = "ai-scrum-api"
version = "1.0.0"
description = "FastAPI backend & orchestration service for AI Scrum Master"
authors = ["AI Scrum Team <team@enterprise.internal>"]
readme = "README.md"
packages = [{include = "api", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
google-cloud-firestore = "^2.19.0"
google-cloud-bigquery = "^3.25.0"
google-cloud-documentai = "^2.30.0"
google-cloud-aiplatform = "^1.70.0"
networkx = "^3.3"
jinja2 = "^3.1.4"
requests = "^2.32.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
